<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>miniCRM</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="layout">
      <aside class="sidebar">
        <a class="brand" href="#/dashboard">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="currentColor" opacity=".18"/><circle cx="9" cy="10" r="3" fill="currentColor"/><circle cx="15.5" cy="11" r="2.5" fill="currentColor" opacity=".7"/><path d="M4 18c1-3 3.2-4.5 5-4.5s4 1.5 5 4.5" fill="currentColor"/></svg>
          <span>miniCRM</span>
        </a>
        <nav class="nav" aria-label="Main">
          <a href="#/dashboard" data-nav="dashboard">Dashboard</a>
          <a href="#/contacts" data-nav="contacts">Contacts</a>
          <a href="#/companies" data-nav="companies">Companies</a>
          <a href="#/deals" data-nav="deals">Deals</a>
          <a href="#/activities" data-nav="activities">Activities</a>
        </nav>
      </aside>
      <main id="app" class="main" tabindex="-1" aria-live="polite"></main>
    </div>

    <dialog id="modal" class="modal">
      <form method="dialog" id="modal-form" novalidate>
        <header class="modal-head">
          <h2 id="modal-title"></h2>
          <button type="button" class="icon-btn" data-action="close-modal" aria-label="Close">✕</button>
        </header>
        <div id="modal-body" class="modal-body"></div>
        <footer class="modal-foot">
          <button type="button" class="btn" data-action="close-modal">Cancel</button>
          <button type="submit" class="btn primary" id="modal-submit">Save</button>
        </footer>
      </form>
    </dialog>

    <div id="toasts" class="toasts" role="status"></div>
    <script src="app.js"></script>
  </body>
</html>
